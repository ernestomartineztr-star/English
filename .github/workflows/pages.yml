name: Build and publish audio library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install speech tools
        run: sudo apt-get update && sudo apt-get install -y espeak-ng lame python3-qrcode
      - name: Generate normal and slow lesson recordings
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          data=json.load(open('lessons.json',encoding='utf-8'))
          for level, lessons in data['levels'].items():
              out=pathlib.Path('audio')/level
              out.mkdir(parents=True,exist_ok=True)
              for lesson in lessons:
                  text=' '.join(x['en'] for x in lesson['dialogue'])
                  for suffix,speed in [('',150),('-slow',112)]:
                      wav=out/(lesson['id']+suffix+'.wav')
                      mp3=out/(lesson['id']+suffix+'.mp3')
                      subprocess.run(['espeak-ng','-v','en-us','-s',str(speed),'-w',str(wav),text],check=True)
                      subprocess.run(['lame','--silent','-V','6',str(wav),str(mp3)],check=True)
                      wav.unlink()
          PY
      - name: Generate QR codes and save audio to repository
        run: |
          python3 - <<'PY'
          import json, pathlib, qrcode
          base='https://ernestomartineztr-star.github.io/English/'
          data=json.load(open('lessons.json',encoding='utf-8'))
          def save(url,path):
              path=pathlib.Path(path); path.parent.mkdir(parents=True,exist_ok=True)
              qrcode.make(url).save(path)
          save(base,'qr/cover.png')
          for level, lessons in data['levels'].items():
              for lesson in lessons:
                  save(base+'#'+level+'/'+lesson['id'],f"qr/{level}/{lesson['id']}.png")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio qr
          if ! git diff --cached --quiet; then
            git commit -m "Add generated lesson audio and QR codes [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
